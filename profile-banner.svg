  <circle cx="864" cy="89" r="5" fill="#76e2c3"/>
  <g font-family="Courier New, monospace" font-size="20">
    <text x="829" y="146" fill="#b38bff">class <tspan fill="#8ce4da">Developer</tspan><tspan fill="#e7eaff">:</tspan></text>
    <text x="845" y="183" fill="#dddff5">name = <tspan fill="#f8c68f">"María"</tspan></text>
    <text x="845" y="219" fill="#dddff5">focus = <tspan fill="#f8c68f">"backend"</tspan></text>
