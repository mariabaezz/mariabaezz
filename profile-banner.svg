  <text x="102" y="86" fill="#b8d4ed" font-size="16" font-family="Arial, Helvetica, sans-serif">HELLO, WORLD!</text>
  <text x="66" y="179" fill="#fff" font-size="68" font-weight="700" font-family="Arial, Helvetica, sans-serif">María Báez</text>
  <rect x="67" y="199" width="400" height="5" rx="3" fill="url(#accent)"/>
  <text x="67" y="248" fill="#d6d8f4" font-size="28" font-family="Arial, Helvetica, sans-serif">Data Science &amp; Engineering</text>
  <text x="67" y="285" fill="#8ce4da" font-size="21" font-family="Arial, Helvetica, sans-serif">Backend • APIs • Databases</text>
  <rect x="802" y="70" width="300" height="207" rx="19" fill="#141b37" stroke="#61668d" stroke-width="2"/>
