<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">María Báez — Backend Development</title>
  <desc id="desc">Dark navy banner with violet and cyan accents and abstract code shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1124"/>
      <stop offset="1" stop-color="#171437"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#80e6e0"/>
      <stop offset="1" stop-color="#ab8bff"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8b9fc8" opacity=".2"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#dots)"/>
  <circle cx="1068" cy="110" r="155" fill="#7160e8" opacity=".11"/>
  <circle cx="963" cy="295" r="130" fill="#44d4d0" opacity=".08"/>
  <rect x="66" y="64" width="163" height="34" rx="17" fill="#242a4c"/>
